name: Nightly render

# Day-ahead: every day at 1:31 PM IST it makes TOMORROW's Reels and sends them to Telegram for approval by midnight.

on:
  schedule:
    - cron: "1 8 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many Reels (blank = reels_per_day from the Sheet)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: nightly-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt "kaggle>=1.7" six
      - name: Kaggle login
        run: |
          case "$KAGGLE_KEY" in KGAT_*) echo "KAGGLE_API_TOKEN=$KAGGLE_KEY" >> "$GITHUB_ENV";; esac
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Write new scripts if fewer than tomorrow needs (Claude writes, Gemini fact-checks)
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: automation
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null 2>&1
          python automation/write_scripts.py
      - name: Pick tonight's scripts
        id: prep
        run: python automation/prepare.py "${{ github.event.inputs.count }}" "${{ github.event_name }}"
        env:
          PYTHONPATH: automation
      - name: Make tomorrow's carousel, quiz post and Stories
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: automation
        run: |
          bash automation/setup_images.sh
          python automation/daily_posts.py
          git config user.name "skt-bot"; git config user.email "skt-bot@users.noreply.github.com"
          git add -A content && git commit -m "Daily posts" && (git pull --rebase -q && git push) || echo "nothing to commit"
      - name: Save the job list
        if: steps.prep.outputs.count != '0'
        run: |
          git config user.name "skt-bot"; git config user.email "skt-bot@users.noreply.github.com"
          git add -A jobs content && git commit -m "Jobs for tonight's render" && (git pull --rebase -q && git push) || echo "nothing to commit"
      - name: Render on Kaggle (GPU T4)
        if: steps.prep.outputs.count != '0'
        run: |
          kaggle kernels push -p kaggle --accelerator NvidiaTeslaT4
          sleep 60
          python automation/wait_kaggle.py sarkarikitaiyari/skt-daily-render 18000
          kaggle kernels output sarkarikitaiyari/skt-daily-render -p out
      - name: Send to Telegram for approval
        if: steps.prep.outputs.count != '0'
        run: python automation/deliver.py out
        env:
          PYTHONPATH: automation
      - name: Save state
        if: always() && steps.prep.outputs.count != '0'
        run: |
          git config user.name "skt-bot"; git config user.email "skt-bot@users.noreply.github.com"
          mkdir -p render/face_cache && touch render/face_cache/.keep
          git add -A content jobs render/face_cache && git commit -m "Rendered $(date +%F)" && (git pull --rebase -q && git push) || echo "nothing to commit"
      - name: Tell Telegram if it failed
        if: failure()
        run: python -c "import sys;sys.path.insert(0,'automation');from common import tg_msg;tg_msg('⚠️ Nightly render failed. Open GitHub → Actions → Nightly render to see the error (send Claude the error text, never keys).')"
      - name: No scripts left
        if: steps.prep.outputs.reason == 'no scripts left'
        run: python -c "import sys;sys.path.insert(0,'automation');from common import tg_msg;tg_msg('📭 No new scripts left to make tomorrow\'s Reels. Ask Claude to add more.')"
